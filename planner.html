<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой планировщик</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #24323a;
    --muted: #5d6b73;
    --brand-1: #3f7a7c;
    --brand-2: #5b6fb5;
    --line: rgba(60, 90, 100, 0.12);
    --glass: rgba(255, 255, 255, 0.62);
    --glass-strong: rgba(255, 255, 255, 0.85);
    --surface: #ffffff;
    --field-bg: rgba(255, 255, 255, 0.9);
    --field-line: rgba(60, 90, 100, 0.24);
    --base-bg: linear-gradient(160deg, #f1f7f4 0%, #edf1fa 55%, #f8f3ee 100%);
    --blob-1: rgba(133, 190, 172, 0.45);
    --blob-2: rgba(140, 160, 225, 0.38);
    --title-grad: linear-gradient(110deg, #2c5a5e 0%, #44609f 100%);
    --danger: #c5221f;
    --danger-bg: rgba(217, 48, 37, 0.10);
    --danger-line: rgba(217, 48, 37, 0.38);
    --p-low: #7f929c;
    --p-medium: #5b6fb5;
    --p-high: #d1822a;
    --p-critical: #c2395b;
    color-scheme: light;
  }
  [data-bs-theme="dark"] {
    --ink: #e8eef0;
    --muted: #9fb0b8;
    --brand-1: #4a8c8e;
    --brand-2: #6b80c7;
    --line: rgba(255, 255, 255, 0.10);
    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(20, 28, 32, 0.75);
    --surface: #1b2428;
    --field-bg: rgba(255, 255, 255, 0.06);
    --field-line: rgba(255, 255, 255, 0.18);
    --base-bg: linear-gradient(160deg, #121a1d 0%, #151a26 60%, #1a1a1f 100%);
    --blob-1: rgba(70, 140, 130, 0.28);
    --blob-2: rgba(90, 110, 190, 0.26);
    --title-grad: linear-gradient(110deg, #9fd3c4 0%, #a9b9f0 100%);
    --danger: #ff8f88;
    --danger-bg: rgba(255, 90, 80, 0.14);
    --danger-line: rgba(255, 120, 110, 0.42);
    --p-low: #93a6b0;
    --p-medium: #8b9ee0;
    --p-high: #e8a35a;
    --p-critical: #ef7b97;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(70vmax 55vmax at 0% 0%, var(--blob-1), transparent 70%),
      radial-gradient(65vmax 55vmax at 100% 35%, var(--blob-2), transparent 70%),
      var(--base-bg);
    background-repeat: no-repeat;
  }

  /* ---------- Шапка ---------- */
  .site-header {
    background: var(--glass-strong);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .site-header .nav-link { color: var(--muted); font-weight: 500; border-radius: 8px; transition: color .15s ease, background .15s ease; }
  .site-header .nav-link:hover { color: var(--ink); background: var(--glass); }
  .brand { font-weight: 800; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .brand::before {
    content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
  }
  footer { border-top: 1px solid var(--line); color: var(--muted); }

  /* ---------- Кнопки ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0.6rem 1.15rem; border-radius: 12px; border: 1px solid transparent;
    font: inherit; font-weight: 600; line-height: 1.4; cursor: pointer; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:focus-visible, .icon-btn:focus-visible, .field:focus-visible, .check:focus-visible,
  .seg button:focus-visible, .task-title:focus-visible {
    outline: 2px solid var(--brand-2); outline-offset: 2px;
  }
  .btn-brand {
    color: #fff;
    background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
    box-shadow: 0 10px 22px -12px rgba(63, 122, 124, 0.7);
  }
  .btn-brand:hover { color: #fff; transform: translateY(-1px); filter: brightness(1.07); box-shadow: 0 14px 26px -12px rgba(63, 122, 124, 0.8); }
  .btn-ghost { color: var(--ink); background: var(--glass); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); background: var(--glass-strong); border-color: var(--brand-1); }
  .btn-danger-solid { color: #fff; background: #c5221f; box-shadow: 0 10px 22px -12px rgba(197, 34, 31, 0.7); }
  .btn-danger-solid:hover { color: #fff; filter: brightness(1.08); transform: translateY(-1px); }
  .btn-danger-ghost { color: var(--danger); background: transparent; border-color: var(--danger-line); }
  .btn-danger-ghost:hover { background: var(--danger-bg); }
  .btn .ico { width: 18px; height: 18px; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; flex-shrink: 0;
    color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { color: var(--ink); background: var(--glass-strong); border-color: var(--line); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-line); }
  .ico { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- Поля ---------- */
  .field {
    width: 100%; min-width: 0; padding: 0.6rem 0.9rem;
    font: inherit; color: var(--ink);
    background: var(--field-bg); border: 1px solid var(--field-line); border-radius: 12px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field::placeholder { color: var(--muted); opacity: .8; }
  .field:hover { border-color: var(--brand-1); }
  .field:focus { outline: none; border-color: var(--brand-1); box-shadow: 0 0 0 3px rgba(63, 122, 124, 0.2); }
  textarea.field { display: block; min-height: 120px; resize: vertical; line-height: 1.55; }
  select.field {
    appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 2.2rem;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select.field option { color: #24323a; background: #fff; }
  [data-bs-theme="dark"] select.field option { color: #e8eef0; background: #1b2428; }
  input[type="date"].field { cursor: pointer; }
  /* Дедлайн «сегодня» — поле подсвечивается красным */
  input[type="date"].field.is-today {
    color: var(--danger); font-weight: 700;
    background-color: var(--danger-bg); border-color: var(--danger-line);
  }
  input[type="date"].field.is-today:focus { box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.2); border-color: var(--danger); }

  /* ---------- Страница ---------- */
  .planner-wrap { max-width: 860px; padding-top: 44px; padding-bottom: 72px; }
  .page-title {
    font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 10px;
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 26px; min-height: 28px; }
  .sum-text { color: var(--muted); font-weight: 500; margin-right: 4px; }

  .section-add { display: flex; gap: 10px; }
  .section-add .field { flex: 1; }

  /* ---------- Фильтр ---------- */
  .filter-bar { margin-top: 22px; }
  .filter-bar:empty { display: none; }
  .seg {
    display: inline-flex; gap: 2px; padding: 4px; max-width: 100%;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .seg button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 7px 15px; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font: inherit; font-size: .9rem; font-weight: 600; white-space: nowrap; cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] {
    color: #fff; background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    box-shadow: 0 8px 18px -10px rgba(63, 122, 124, 0.8);
  }
  .seg .n { font-size: .75rem; font-weight: 700; opacity: .75; }

  .empty {
    margin-top: 28px; padding: 44px 24px; text-align: center; color: var(--muted);
    background: var(--glass); border: 1px dashed var(--field-line); border-radius: 20px;
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

  /* ---------- Раздел ---------- */
  .section-card {
    margin-top: 18px; padding: 20px 22px 22px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 18px 40px -28px rgba(40, 70, 90, 0.45);
  }
  .sec-head { display: flex; align-items: center; gap: 6px; }
  .sec-title { flex: 1; min-width: 0; margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .sec-count { color: var(--muted); font-size: .85rem; font-weight: 600; margin-right: 8px; white-space: nowrap; }
  .bar { height: 6px; margin: 12px 0 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); transition: width .3s ease; }

  .tasks { list-style: none; margin: 0; padding: 0; }
  .task-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .task-row:last-child { border-bottom: 0; }
  .check { width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--brand-1); cursor: pointer; }
  .task-main { flex: 1 1 200px; min-width: 0; }
  .task-title {
    display: block; max-width: 100%; padding: 0; margin: 0; border: 0; background: none;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere;
  }
  .task-title:hover { color: var(--brand-1); }
  [data-bs-theme="dark"] .task-title:hover { color: #9fd3c4; }
  .task-desc { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--muted); font-size: .84rem; }
  .task-desc .ico { width: 14px; height: 14px; }
  .task-desc span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-row.done .prio, .task-row.done .due { opacity: .5; }
  .task-actions { display: flex; gap: 2px; margin-left: auto; }
  .no-tasks { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }

  /* Приоритет */
  .prio {
    --p: var(--p-medium);
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; white-space: nowrap;
    font-size: .78rem; font-weight: 700; border-radius: 999px;
    color: color-mix(in srgb, var(--p) 78%, var(--ink));
    background: color-mix(in srgb, var(--p) 14%, transparent);
  }
  .prio::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--p); }
  .prio-low { --p: var(--p-low); }
  .prio-medium { --p: var(--p-medium); }
  .prio-high { --p: var(--p-high); }
  .prio-critical { --p: var(--p-critical); font-weight: 800; }

  /* Дедлайн */
  .due {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; white-space: nowrap;
    font-size: .78rem; font-weight: 600; color: var(--muted);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
  }
  .due .ico { width: 14px; height: 14px; }
  .due.today { color: var(--danger); font-weight: 800; background: var(--danger-bg); border-color: var(--danger-line); }
  .due.overdue { color: #fff; font-weight: 800; background: #c5221f; border-color: transparent; }

  /* Форма добавления задачи */
  .add-form {
    display: grid; grid-template-columns: minmax(0, 1fr) 168px 176px auto; gap: 10px; align-items: end;
    margin-top: 14px; padding-top: 16px; border-top: 1px dashed var(--field-line);
  }
  .mini { display: block; margin: 0 0 5px 2px; color: var(--muted); font-size: .75rem; font-weight: 700; }
  @media (max-width: 767.98px) {
    .add-form { grid-template-columns: 1fr 1fr; }
    .add-form .f-text, .add-form .btn { grid-column: 1 / -1; }
    .section-add { flex-direction: column; }
    .seg { display: flex; width: 100%; }
    .seg button { flex: 1; padding: 7px 6px; font-size: .82rem; gap: 5px; }
  }

  /* ---------- Диалоги ---------- */
  dialog {
    width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 0; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 40px 80px -30px rgba(20, 40, 60, 0.6);
  }
  dialog.wide { width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20, 32, 40, 0.38); backdrop-filter: blur(3px); }
  #dlg-form { padding: 24px; display: grid; gap: 14px; }
  .dlg-title { margin: 0; font-size: 1.2rem; font-weight: 800; }
  .dlg-msg { margin: -8px 0 0; color: var(--muted); }
  .dlg-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .dlg-grid { grid-template-columns: 1fr; } }
  .date-row { display: flex; gap: 8px; }
  .date-row .btn { white-space: nowrap; }
  .check-line { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; width: fit-content; }
  .dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .dlg-actions .btn-danger-ghost { margin-right: auto; }
</style>
<script>
  // Тема под настройки системы (светлая/тёмная)
  (function () {
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
  })();
</script>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header sticky-top">
  <div class="container py-3">
    <div class="row align-items-center gy-2">
      <nav class="col-12 col-lg-4">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link px-3" href="#">Блог</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#">О нас</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#">Инструкции</a></li>
        </ul>
      </nav>
      <div class="col-6 col-lg-4 text-lg-center">
        <a class="brand fs-5" href="index.html">Планировщик</a>
      </div>
      <div class="col-6 col-lg-4 text-end">
        <a class="btn btn-ghost" href="#">Войти</a>
      </div>
    </div>
  </div>
</header>

<main class="flex-grow-1">
  <div class="container planner-wrap">
    <h1 class="page-title">Мой планировщик</h1>
    <div class="summary" id="summary"></div>

    <form id="section-form" class="section-add">
      <input class="field" type="text" id="section-input" maxlength="80" required
             placeholder="Новый раздел, например «Работа»" aria-label="Название нового раздела">
      <button class="btn btn-brand" type="submit" id="section-submit"></button>
    </form>

    <div class="filter-bar" id="filter"></div>

    <div id="sections"></div>
  </div>
</main>

<footer class="py-4 mt-auto">
  <div class="container text-center small">© 2026 Планировщик задач</div>
</footer>

<dialog id="dlg"><form id="dlg-form"></form></dialog>

<script>
  const KEY = "planner-v1";
  const FILTER_KEY = "planner-filter-v1";
  const PRIORITIES = [
    { id: "low",      label: "Незначительный" },
    { id: "medium",   label: "Средний" },
    { id: "high",     label: "Высокий" },
    { id: "critical", label: "Критичный" }
  ];
  const PRIO_LABEL = Object.fromEntries(PRIORITIES.map(p => [p.id, p.label]));
  const FILTERS = [
    { id: "all",    label: "Все" },
    { id: "active", label: "Не выполненные" },
    { id: "done",   label: "Выполненные" }
  ];
  const ICONS = {
    edit:  '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
    cal:   '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    plus:  '<path d="M12 5v14M5 12h14"/>',
    note:  '<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/>'
  };

  /* ---------- Даты (по местному времени, а не UTC) ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return fmt(new Date()); }
  function tomorrowStr() { const d = new Date(); d.setDate(d.getDate() + 1); return fmt(d); }
  function parseDate(s) { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }

  /* ---------- Данные ---------- */
  let state = load();
  let currentFilter = loadFilter();
  let lastToday = todayStr();

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (data && Array.isArray(data.sections)) {
        data.sections.forEach(s => {
          s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
          s.tasks.forEach(t => {
            // Задачи из прошлых версий получают значения по умолчанию
            if (!PRIO_LABEL[t.priority]) t.priority = "medium";
            if (typeof t.deadline !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(t.deadline)) t.deadline = "";
            if (typeof t.description !== "string") t.description = "";
            t.done = !!t.done;
          });
        });
        return data;
      }
    } catch (e) {}
    return { sections: [] };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadFilter() {
    try {
      const f = localStorage.getItem(FILTER_KEY);
      if (FILTERS.some(x => x.id === f)) return f;
    } catch (e) {}
    return "all";
  }

  function storeFilter() {
    try { localStorage.setItem(FILTER_KEY, currentFilter); } catch (e) {}
  }

  function passesFilter(task) {
    if (currentFilter === "done") return task.done;
    if (currentFilter === "active") return !task.done;
    return true;
  }

  function commit() { save(); render(); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------- Помощники для DOM ---------- */
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    if (props) {
      const { attrs, ...rest } = props;
      Object.assign(node, rest);
      if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
    }
    children.forEach(c => { if (c != null) node.append(c); });
    return node;
  }

  function icon(name) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("class", "ico");
    s.setAttribute("aria-hidden", "true");
    s.innerHTML = ICONS[name]; // только собственные константы, не пользовательский ввод
    return s;
  }

  function iconButton(name, label, onClick, extraClass) {
    return el("button", {
      type: "button", className: "icon-btn " + (extraClass || ""), onclick: onClick,
      title: label, attrs: { "aria-label": label }
    }, icon(name));
  }

  function makeSelect(options, value) {
    const sel = el("select", { className: "field" },
      ...options.map(o => el("option", { value: o.id, textContent: o.label })));
    sel.value = value;
    return sel;
  }

  // Красная подсветка поля, когда выбран сегодняшний день
  function trackToday(input) {
    const upd = () => input.classList.toggle("is-today", input.value === todayStr());
    input.addEventListener("input", upd);
    input.addEventListener("change", upd);
    upd();
  }

  function dueInfo(task) {
    if (!task.deadline) return null;
    const today = todayStr();
    const d = parseDate(task.deadline);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    const short = d.toLocaleDateString("ru-RU", sameYear ? { day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" });
    const full = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
    let kind = "future", text = short;
    if (task.deadline === today) { kind = "today"; text = "Сегодня"; }
    else if (task.deadline < today) { kind = "overdue"; text = "Просрочено · " + short; }
    else if (task.deadline === tomorrowStr()) { text = "Завтра"; }
    if (task.done) kind = "done"; // у выполненных задач тревожной подсветки нет
    return { kind: kind, text: text, title: "Дедлайн: " + full };
  }

  /* ---------- Диалог (карточка задачи, переименование, подтверждение) ---------- */
  function openDialog(cfg) {
    return new Promise(resolve => {
      const dlg = document.getElementById("dlg");
      const form = document.getElementById("dlg-form");
      const inputs = {};
      let settled = false;
      const finish = v => { if (!settled) { settled = true; resolve(v); } };

      dlg.classList.toggle("wide", !!cfg.wide);
      form.replaceChildren();
      form.append(el("h3", { className: "dlg-title", textContent: cfg.title }));
      if (cfg.message) form.append(el("p", { className: "dlg-msg", textContent: cfg.message }));

      let grid = null;
      (cfg.fields || []).forEach(f => {
        let input, box;
        if (f.type === "select") {
          input = makeSelect(f.options, f.value);
        } else if (f.type === "textarea") {
          input = el("textarea", { className: "field", value: f.value || "", rows: f.rows || 4, maxLength: f.maxLength || 2000, placeholder: f.placeholder || "" });
        } else if (f.type === "checkbox") {
          input = el("input", { type: "checkbox", className: "check", checked: !!f.value });
        } else {
          input = el("input", { type: f.type || "text", className: "field", value: f.value || "", required: !!f.required, maxLength: f.maxLength || 200 });
        }
        input.id = "dlg-" + f.name;
        inputs[f.name] = input;

        if (f.type === "checkbox") {
          box = el("label", { className: "check-line", htmlFor: input.id }, input, f.label);
        } else {
          box = el("div", null, el("label", { className: "mini", htmlFor: input.id, textContent: f.label }));
          if (f.type === "date") {
            trackToday(input);
            const clear = el("button", { type: "button", className: "btn btn-ghost", textContent: "Без срока" });
            clear.onclick = () => { input.value = ""; input.dispatchEvent(new Event("input")); };
            box.append(el("div", { className: "date-row" }, input, clear));
          } else {
            box.append(input);
          }
        }

        if (f.half) {
          if (!grid) { grid = el("div", { className: "dlg-grid" }); form.append(grid); }
          grid.append(box);
        } else {
          grid = null;
          form.append(box);
        }
      });

      const actions = el("div", { className: "dlg-actions" });
      if (cfg.secondary) {
        const sec = el("button", { type: "button", className: "btn btn-danger-ghost", textContent: cfg.secondary.text });
        sec.onclick = () => { finish({ __action: cfg.secondary.action }); dlg.close(); };
        actions.append(sec);
      }
      const cancel = el("button", { type: "button", className: "btn btn-ghost", textContent: "Отмена" });
      cancel.onclick = () => dlg.close();
      const ok = el("button", { type: "submit", className: "btn " + (cfg.danger ? "btn-danger-solid" : "btn-brand"), textContent: cfg.submit || "Сохранить" });
      actions.append(cancel, ok);
      form.append(actions);

      form.onsubmit = e => {
        e.preventDefault();
        const values = {};
        for (const k in inputs) {
          const i = inputs[k];
          values[k] = i.type === "checkbox" ? i.checked : i.value.trim();
        }
        finish(values);
        dlg.close();
      };
      dlg.onclose = () => finish(null);
      dlg.showModal();
    });
  }

  // Закрытие по клику на затемнённый фон
  document.getElementById("dlg").addEventListener("click", e => {
    if (e.target === e.currentTarget) e.currentTarget.close();
  });

  /* ---------- Карточка задачи ---------- */
  async function openTask(sec, task) {
    const v = await openDialog({
      title: "Карточка задачи",
      message: "Раздел: " + sec.title,
      wide: true,
      submit: "Сохранить",
      secondary: { text: "Удалить задачу", action: "delete" },
      fields: [
        { name: "text", label: "Название", value: task.text, required: true },
        { name: "done", label: "Выполнена", type: "checkbox", value: task.done },
        { name: "deadline", label: "Дедлайн", type: "date", value: task.deadline, half: true },
        { name: "priority", label: "Приоритет", type: "select", options: PRIORITIES, value: task.priority, half: true },
        { name: "description", label: "Описание", type: "textarea", rows: 5, value: task.description,
          placeholder: "Детали, ссылки, заметки…" }
      ]
    });
    if (!v) return;
    if (v.__action === "delete") {
      sec.tasks = sec.tasks.filter(t => t.id !== task.id);
      commit();
      return;
    }
    if (v.text) {
      task.text = v.text;
      task.done = v.done;
      task.deadline = v.deadline;
      task.priority = v.priority;
      task.description = v.description;
      commit();
    }
  }

  /* ---------- Отрисовка ---------- */
  function renderSummary() {
    const box = document.getElementById("summary");
    box.replaceChildren();
    const all = state.sections.flatMap(s => s.tasks);
    const done = all.filter(t => t.done).length;
    const today = todayStr();
    const dueToday = all.filter(t => !t.done && t.deadline === today).length;
    const overdue = all.filter(t => !t.done && t.deadline && t.deadline < today).length;
    box.append(el("span", { className: "sum-text", textContent: all.length ? "Выполнено " + done + " из " + all.length : "Пока нет задач" }));
    if (dueToday) box.append(el("span", { className: "due today", textContent: "Срок сегодня: " + dueToday }));
    if (overdue) box.append(el("span", { className: "due overdue", textContent: "Просрочено: " + overdue }));
  }

  function renderFilter() {
    const box = document.getElementById("filter");
    box.replaceChildren();
    if (!state.sections.length) return;
    const all = state.sections.flatMap(s => s.tasks);
    const counts = {
      all: all.length,
      active: all.filter(t => !t.done).length,
      done: all.filter(t => t.done).length
    };
    box.append(el("div", { className: "seg", attrs: { role: "group", "aria-label": "Фильтр задач" } },
      ...FILTERS.map(f => el("button", {
        type: "button",
        onclick: () => { currentFilter = f.id; storeFilter(); render(); },
        attrs: { "aria-pressed": String(currentFilter === f.id) }
      }, f.label, el("span", { className: "n", textContent: String(counts[f.id]) })))
    ));
  }

  function renderTask(sec, task) {
    const checkbox = el("input", { type: "checkbox", className: "check", checked: task.done,
      attrs: { "aria-label": "Выполнена: " + task.text } });
    checkbox.onchange = () => { task.done = checkbox.checked; commit(); };

    const main = el("div", { className: "task-main" },
      el("button", { type: "button", className: "task-title", textContent: task.text, title: "Открыть карточку",
        onclick: () => openTask(sec, task) })
    );
    if (task.description) {
      main.append(el("div", { className: "task-desc" }, icon("note"), el("span", { textContent: task.description })));
    }

    const row = el("li", { className: "task-row" + (task.done ? " done" : "") },
      checkbox,
      main,
      el("span", { className: "prio prio-" + task.priority, textContent: PRIO_LABEL[task.priority] })
    );

    const due = dueInfo(task);
    if (due) {
      row.append(el("span", { className: "due " + due.kind, title: due.title }, icon("cal"), due.text));
    }

    row.append(el("div", { className: "task-actions" },
      iconButton("edit", "Открыть карточку", () => openTask(sec, task)),
      iconButton("trash", "Удалить задачу", () => {
        sec.tasks = sec.tasks.filter(t => t.id !== task.id);
        commit();
      }, "danger")
    ));
    return row;
  }

  function renderAddForm(sec) {
    const text = el("input", { type: "text", className: "field", required: true, maxLength: 200, id: "nt-" + sec.id,
      placeholder: "Что нужно сделать?", attrs: { "aria-label": "Новая задача" } });
    const date = el("input", { type: "date", className: "field", id: "nd-" + sec.id });
    trackToday(date);
    const prio = makeSelect(PRIORITIES, "medium");
    prio.id = "np-" + sec.id;

    const form = el("form", { className: "add-form" },
      el("div", { className: "f-text" }, el("label", { className: "mini", htmlFor: text.id, textContent: "Новая задача" }), text),
      el("div", null, el("label", { className: "mini", htmlFor: date.id, textContent: "Дедлайн" }), date),
      el("div", null, el("label", { className: "mini", htmlFor: prio.id, textContent: "Приоритет" }), prio),
      el("button", { type: "submit", className: "btn btn-brand" }, icon("plus"), "Добавить")
    );
    form.onsubmit = e => {
      e.preventDefault();
      const value = text.value.trim();
      if (!value) return;
      sec.tasks.push({ id: uid(), text: value, done: false, deadline: date.value, priority: prio.value, description: "" });
      // Новая задача не выполнена: при фильтре «Выполненные» её бы не было видно
      if (currentFilter === "done") { currentFilter = "all"; storeFilter(); }
      commit();
    };
    return form;
  }

  function renderSection(sec) {
    const total = sec.tasks.length;
    const done = sec.tasks.filter(t => t.done).length;
    const visible = sec.tasks.filter(passesFilter);

    const head = el("div", { className: "sec-head" },
      el("h2", { className: "sec-title", textContent: sec.title }),
      el("span", { className: "sec-count", textContent: total ? done + " из " + total : "" }),
      iconButton("edit", "Переименовать раздел", async () => {
        const v = await openDialog({
          title: "Переименовать раздел",
          fields: [{ name: "title", label: "Название раздела", value: sec.title, required: true, maxLength: 80 }]
        });
        if (v && v.title) { sec.title = v.title; commit(); }
      }),
      iconButton("trash", "Удалить раздел", async () => {
        const v = await openDialog({
          title: "Удалить раздел?",
          message: total
            ? "Раздел «" + sec.title + "» и все его задачи (" + total + ") будут удалены без возможности восстановления."
            : "Раздел «" + sec.title + "» будет удалён.",
          submit: "Удалить", danger: true
        });
        if (v) { state.sections = state.sections.filter(s => s.id !== sec.id); commit(); }
      }, "danger")
    );

    const bar = el("div", { className: "bar", attrs: { "aria-hidden": "true" } },
      el("span", { style: "width:" + (total ? Math.round(done / total * 100) : 0) + "%" }));

    const list = visible.length
      ? el("ul", { className: "tasks" }, ...visible.map(t => renderTask(sec, t)))
      : el("p", { className: "no-tasks", textContent: total ? "Нет задач, подходящих под фильтр." : "В этом разделе пока нет задач." });

    return el("section", { className: "section-card" }, head, bar, list, renderAddForm(sec));
  }

  function render() {
    lastToday = todayStr();
    renderSummary();
    renderFilter();
    const root = document.getElementById("sections");
    root.replaceChildren();
    if (!state.sections.length) {
      root.append(el("div", { className: "empty" },
        el("strong", { textContent: "Пока нет разделов" }),
        "Создайте первый раздел выше, например «Работа» или «Дом»."));
      return;
    }
    state.sections.forEach(sec => root.append(renderSection(sec)));
  }

  /* ---------- Старт ---------- */
  document.getElementById("section-submit").append(icon("plus"), "Добавить раздел");

  document.getElementById("section-form").onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("section-input");
    const title = input.value.trim();
    if (!title) return;
    state.sections.push({ id: uid(), title: title, tasks: [] });
    input.value = "";
    commit();
  };

  // Если вкладка осталась открытой за полночь, обновляем подсветку «сегодня»
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && todayStr() !== lastToday) render();
  });

  render();
</script>
</body>
</html>
