<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой планировщик</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #24323a;
    --muted: #5d6b73;
    --brand-1: #3f7a7c;
    --brand-2: #5b6fb5;
    --line: rgba(60, 90, 100, 0.12);
    --glass: rgba(255, 255, 255, 0.62);
    --glass-strong: rgba(255, 255, 255, 0.85);
    --surface: #ffffff;
    --field-bg: rgba(255, 255, 255, 0.9);
    --field-line: rgba(60, 90, 100, 0.24);
    --base-bg: linear-gradient(160deg, #f1f7f4 0%, #edf1fa 55%, #f8f3ee 100%);
    --blob-1: rgba(133, 190, 172, 0.45);
    --blob-2: rgba(140, 160, 225, 0.38);
    --title-grad: linear-gradient(110deg, #2c5a5e 0%, #44609f 100%);
    --danger: #c5221f;
    --danger-bg: rgba(217, 48, 37, 0.10);
    --danger-line: rgba(217, 48, 37, 0.38);
    --p-low: #7f929c;
    --p-medium: #5b6fb5;
    --p-high: #d1822a;
    --p-critical: #c2395b;
    color-scheme: light;
  }
  [data-bs-theme="dark"] {
    --ink: #e8eef0;
    --muted: #9fb0b8;
    --brand-1: #4a8c8e;
    --brand-2: #6b80c7;
    --line: rgba(255, 255, 255, 0.10);
    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(20, 28, 32, 0.75);
    --surface: #1b2428;
    --field-bg: rgba(255, 255, 255, 0.06);
    --field-line: rgba(255, 255, 255, 0.18);
    --base-bg: linear-gradient(160deg, #121a1d 0%, #151a26 60%, #1a1a1f 100%);
    --blob-1: rgba(70, 140, 130, 0.28);
    --blob-2: rgba(90, 110, 190, 0.26);
    --title-grad: linear-gradient(110deg, #9fd3c4 0%, #a9b9f0 100%);
    --danger: #ff8f88;
    --danger-bg: rgba(255, 90, 80, 0.14);
    --danger-line: rgba(255, 120, 110, 0.42);
    --p-low: #93a6b0;
    --p-medium: #8b9ee0;
    --p-high: #e8a35a;
    --p-critical: #ef7b97;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(70vmax 55vmax at 0% 0%, var(--blob-1), transparent 70%),
      radial-gradient(65vmax 55vmax at 100% 35%, var(--blob-2), transparent 70%),
      var(--base-bg);
    background-repeat: no-repeat;
  }

  /* ---------- Шапка ---------- */
  .site-header {
    background: var(--glass-strong);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .site-header .nav-link { color: var(--muted); font-weight: 500; border-radius: 8px; transition: color .15s ease, background .15s ease; }
  .site-header .nav-link:hover { color: var(--ink); background: var(--glass); }
  .brand { font-weight: 800; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .brand::before {
    content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
  }
  footer { border-top: 1px solid var(--line); color: var(--muted); }

  /* ---------- Кнопки ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0.6rem 1.15rem; border-radius: 12px; border: 1px solid transparent;
    font: inherit; font-weight: 600; line-height: 1.4; cursor: pointer; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:focus-visible, .icon-btn:focus-visible, .field:focus-visible, .check:focus-visible,
  .seg button:focus-visible, .task-title:focus-visible, .note:focus-visible, summary:focus-visible {
    outline: 2px solid var(--brand-2); outline-offset: 2px;
  }
  .btn-brand {
    color: #fff;
    background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
    box-shadow: 0 10px 22px -12px rgba(63, 122, 124, 0.7);
  }
  .btn-brand:hover { color: #fff; transform: translateY(-1px); filter: brightness(1.07); box-shadow: 0 14px 26px -12px rgba(63, 122, 124, 0.8); }
  .btn-ghost { color: var(--ink); background: var(--glass); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); background: var(--glass-strong); border-color: var(--brand-1); }
  .btn-danger-solid { color: #fff; background: #c5221f; box-shadow: 0 10px 22px -12px rgba(197, 34, 31, 0.7); }
  .btn-danger-solid:hover { color: #fff; filter: brightness(1.08); transform: translateY(-1px); }
  .btn-danger-ghost { color: var(--danger); background: transparent; border-color: var(--danger-line); }
  .btn-danger-ghost:hover { background: var(--danger-bg); }
  .btn-sm { padding: 0.4rem 0.85rem; font-size: .85rem; border-radius: 10px; }
  .btn .ico { width: 18px; height: 18px; }
  .btn-sm .ico { width: 16px; height: 16px; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; flex-shrink: 0;
    color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
    font: inherit; transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { color: var(--ink); background: var(--glass-strong); border-color: var(--line); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-line); }
  .ico { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- Поля ---------- */
  .field {
    width: 100%; min-width: 0; padding: 0.6rem 0.9rem;
    font: inherit; color: var(--ink);
    background: var(--field-bg); border: 1px solid var(--field-line); border-radius: 12px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field::placeholder { color: var(--muted); opacity: .8; }
  .field:hover { border-color: var(--brand-1); }
  .field:focus { outline: none; border-color: var(--brand-1); box-shadow: 0 0 0 3px rgba(63, 122, 124, 0.2); }
  textarea.field { display: block; min-height: 120px; resize: vertical; line-height: 1.55; }
  select.field {
    appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 2.2rem;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select.field option { color: #24323a; background: #fff; }
  [data-bs-theme="dark"] select.field option { color: #e8eef0; background: #1b2428; }
  input[type="date"].field { cursor: pointer; }
  /* Дедлайн «сегодня» — поле подсвечивается красным */
  input[type="date"].field.is-today {
    color: var(--danger); font-weight: 700;
    background-color: var(--danger-bg); border-color: var(--danger-line);
  }
  input[type="date"].field.is-today:focus { box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.2); border-color: var(--danger); }
  .mini { display: block; margin: 0 0 5px 2px; color: var(--muted); font-size: .75rem; font-weight: 700; }

  /* ---------- Страница и колонки ---------- */
  .container.planner-wrap { max-width: 1240px; padding-top: 40px; padding-bottom: 72px; }
  .page-title {
    font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 10px;
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 24px; min-height: 28px; }
  .sum-text { color: var(--muted); font-weight: 500; margin-right: 4px; }

  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 34px; } }
  .col-head { display: flex; align-items: center; gap: 10px; min-height: 40px; margin-bottom: 12px; }
  .col-title { flex: 1; margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; }
  .col-count { color: var(--muted); font-size: .85rem; font-weight: 600; }

  .section-add { display: flex; gap: 10px; }
  .section-add .field { flex: 1; }

  /* ---------- Фильтр ---------- */
  .filter-bar { margin-top: 14px; }
  .filter-bar:empty { display: none; }
  .seg {
    display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; max-width: 100%;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .seg button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 8px; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font: inherit; font-size: .84rem; font-weight: 600; white-space: nowrap; cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] {
    color: #fff; background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    box-shadow: 0 8px 18px -10px rgba(63, 122, 124, 0.8);
  }
  .seg .n { font-size: .74rem; font-weight: 700; opacity: .75; }

  .empty {
    margin-top: 18px; padding: 36px 20px; text-align: center; color: var(--muted);
    background: var(--glass); border: 1px dashed var(--field-line); border-radius: 20px;
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }
  .empty .btn { margin-top: 14px; }

  /* ---------- Карточки-разделы ---------- */
  .section-card {
    margin-top: 16px; padding: 18px 18px 20px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 18px 40px -28px rgba(40, 70, 90, 0.45);
  }
  .sec-head { display: flex; align-items: center; gap: 6px; }
  .sec-title { flex: 1; min-width: 0; margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .sec-count { color: var(--muted); font-size: .85rem; font-weight: 600; margin-right: 6px; white-space: nowrap; }
  .bar { height: 6px; margin: 12px 0 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); transition: width .3s ease; }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }

  .tasks { list-style: none; margin: 0; padding: 0; }
  .task-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .task-row:last-child { border-bottom: 0; }
  .check { width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--brand-1); cursor: pointer; }
  .task-main { flex: 1 1 150px; min-width: 0; }
  .task-title {
    display: block; max-width: 100%; padding: 0; margin: 0; border: 0; background: none;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere;
  }
  .task-title:hover { color: var(--brand-1); }
  [data-bs-theme="dark"] .task-title:hover { color: #9fd3c4; }
  .task-text { overflow-wrap: anywhere; }
  .task-desc { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--muted); font-size: .84rem; }
  .task-desc .ico { width: 14px; height: 14px; }
  .task-desc span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row.done .task-title, .task-row.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-row.done .prio, .task-row.done .due { opacity: .5; }
  .task-actions { display: flex; gap: 2px; margin-left: auto; }
  .no-tasks { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }

  /* Приоритет */
  .prio {
    --p: var(--p-medium);
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; white-space: nowrap;
    font-size: .76rem; font-weight: 700; border-radius: 999px;
    color: color-mix(in srgb, var(--p) 78%, var(--ink));
    background: color-mix(in srgb, var(--p) 14%, transparent);
  }
  .prio::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--p); }
  .prio-low { --p: var(--p-low); }
  .prio-medium { --p: var(--p-medium); }
  .prio-high { --p: var(--p-high); }
  .prio-critical { --p: var(--p-critical); font-weight: 800; }

  /* Дедлайн */
  .due {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; white-space: nowrap;
    font-size: .76rem; font-weight: 600; color: var(--muted);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
  }
  .due .ico { width: 14px; height: 14px; }
  .due.today { color: var(--danger); font-weight: 800; background: var(--danger-bg); border-color: var(--danger-line); }
  .due.overdue { color: #fff; font-weight: 800; background: #c5221f; border-color: transparent; }

  /* Форма добавления задачи */
  .add-form {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end;
    margin-top: 14px; padding-top: 16px; border-top: 1px dashed var(--field-line);
  }
  .add-form .f-text, .add-form .btn { grid-column: 1 / -1; }

  /* ---------- Тренировки ---------- */
  details.day { border-bottom: 1px solid var(--line); }
  details.day:last-child { border-bottom: 0; }
  details.day > summary {
    display: flex; align-items: center; gap: 10px; padding: 11px 0; cursor: pointer; list-style: none; font-weight: 700;
  }
  details.day > summary::-webkit-details-marker { display: none; }
  details.day > summary::before {
    content: ""; width: 7px; height: 7px; flex-shrink: 0; margin: 0 2px 2px 3px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .15s ease;
  }
  details.day[open] > summary::before { transform: rotate(45deg); margin-bottom: 4px; }
  .day-count { margin-left: auto; color: var(--muted); font-size: .85rem; font-weight: 600; white-space: nowrap; }
  details.day .tasks { padding-bottom: 8px; }

  /* ---------- Заметки ---------- */
  .notes-list { display: grid; gap: 12px; margin-top: 12px; }
  .note {
    padding: 14px 16px; background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .note:hover { transform: translateY(-2px); border-color: var(--brand-1); box-shadow: 0 14px 28px -20px rgba(40, 70, 90, 0.5); }
  .note h3 { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 4px; font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
  .note p {
    margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .note .meta { margin-top: 8px; font-size: .75rem; color: var(--muted); font-weight: 600; }
  .pin { color: var(--brand-1); font-size: .72rem; font-weight: 800; white-space: nowrap; }
  [data-bs-theme="dark"] .pin { color: #9fd3c4; }

  /* ---------- Диалоги ---------- */
  dialog {
    width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 0; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 40px 80px -30px rgba(20, 40, 60, 0.6);
  }
  dialog.wide { width: min(560px, calc(100vw - 32px)); }
  #wdlg { width: min(820px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20, 32, 40, 0.38); backdrop-filter: blur(3px); }
  #dlg-form, #wdlg-form { padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .dlg-title { margin: 0; font-size: 1.2rem; font-weight: 800; }
  .dlg-msg { margin: -8px 0 0; color: var(--muted); }
  .dlg-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .dlg-grid { grid-template-columns: minmax(0, 1fr); } }
  .date-row { display: flex; gap: 8px; }
  .date-row .btn { white-space: nowrap; }
  .check-line { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; width: fit-content; }
  .dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .dlg-actions .btn-danger-ghost { margin-right: auto; }

  /* Редактор таблицы тренировок */
  .wd-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
  .wd-top .f { width: 190px; }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--field-bg); }
  .tbl-scroll { max-height: 340px; overflow: auto; }
  table.plan { width: 100%; border-collapse: collapse; min-width: 560px; }
  table.plan th { position: sticky; top: 0; z-index: 1; padding: 10px 8px; text-align: left; font-size: .75rem; font-weight: 700; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
  table.plan td { padding: 6px; border-bottom: 1px solid var(--line); }
  table.plan tr:last-child td { border-bottom: 0; }
  table.plan .field { padding: 0.4rem 0.55rem; border-radius: 9px; }
  table.plan input[type="number"] { text-align: center; -moz-appearance: textfield; }
  table.plan td.day-cell { width: 74px; padding-left: 12px; font-weight: 700; color: var(--muted); }
  .ex-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ex-bar .seg { display: inline-flex; width: auto; }
  .ex-bar .seg button { flex: none; padding: 7px 14px; }
  .ex-add { display: flex; gap: 6px; margin-left: auto; }
  .ex-add .field { width: 200px; }
  @media (max-width: 720px) { .ex-add { margin-left: 0; width: 100%; } .ex-add .field { flex: 1; width: auto; } .wd-top .f { width: 100%; } }
  .wd-info { margin: 0; color: var(--muted); font-size: .92rem; }
  .wd-warn { margin: 0; color: var(--danger); font-size: .9rem; font-weight: 600; }
  .wd-warn:empty, .wd-info:empty { display: none; }
</style>
<script>
  // Тема под настройки системы (светлая/тёмная)
  (function () {
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
  })();
</script>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header sticky-top">
  <div class="container py-3">
    <div class="row align-items-center gy-2">
      <nav class="col-12 col-lg-4">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link px-3" href="#">Блог</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#">О нас</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#">Инструкции</a></li>
        </ul>
      </nav>
      <div class="col-6 col-lg-4 text-lg-center">
        <a class="brand fs-5" href="index.html">Планировщик</a>
      </div>
      <div class="col-6 col-lg-4 text-end">
        <a class="btn btn-ghost" href="#">Войти</a>
      </div>
    </div>
  </div>
</header>

<main class="flex-grow-1">
  <div class="container planner-wrap">
    <h1 class="page-title">Мой планировщик</h1>
    <div class="summary" id="summary"></div>

    <div class="cols">

      <!-- Колонка 1: задачи -->
      <section class="col-tasks" aria-labelledby="h-tasks">
        <div class="col-head"><h2 class="col-title" id="h-tasks">Задачи</h2><span class="col-count" id="tasks-count"></span></div>
        <form id="section-form" class="section-add">
          <input class="field" type="text" id="section-input" maxlength="80" required
                 placeholder="Новый раздел, например «Работа»" aria-label="Название нового раздела">
          <button class="btn btn-brand" type="submit" id="section-submit"></button>
        </form>
        <div class="filter-bar" id="filter"></div>
        <div id="sections"></div>
      </section>

      <!-- Колонка 2: тренировки -->
      <section class="col-workouts" aria-labelledby="h-workouts">
        <div class="col-head"><h2 class="col-title" id="h-workouts">Тренировки</h2></div>
        <div id="workouts"></div>
      </section>

      <!-- Колонка 3: заметки -->
      <section class="col-notes" aria-labelledby="h-notes">
        <div class="col-head">
          <h2 class="col-title" id="h-notes">Заметки</h2>
          <button class="btn btn-ghost btn-sm" type="button" id="note-new"></button>
        </div>
        <input class="field" type="search" id="note-search" placeholder="Поиск по заметкам" aria-label="Поиск по заметкам">
        <div class="notes-list" id="notes"></div>
      </section>

    </div>
  </div>
</main>

<footer class="py-4 mt-auto">
  <div class="container text-center small">© 2026 Планировщик задач</div>
</footer>

<dialog id="dlg"><form id="dlg-form"></form></dialog>
<dialog id="wdlg"><form id="wdlg-form"></form></dialog>

<script>
  const KEY = "planner-v1";
  const FILTER_KEY = "planner-filter-v1";
  const MAX_SETS = 4;
  const MAX_DAYS = 30;
  const PRIORITIES = [
    { id: "low",      label: "Незначительный" },
    { id: "medium",   label: "Средний" },
    { id: "high",     label: "Высокий" },
    { id: "critical", label: "Критичный" }
  ];
  const PRIO_LABEL = Object.fromEntries(PRIORITIES.map(p => [p.id, p.label]));
  const FILTERS = [
    { id: "all",    label: "Все" },
    { id: "active", label: "Не выполненные" },
    { id: "done",   label: "Выполненные" }
  ];
  const ICONS = {
    edit:  '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
    cal:   '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    plus:  '<path d="M12 5v14M5 12h14"/>',
    note:  '<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/>',
    grid:  '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>'
  };

  const $ = id => document.getElementById(id);
  const str = v => (typeof v === "string" ? v : "");
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const clampInt = (v, lo, hi) => { const n = parseInt(v, 10); return isNaN(n) ? 0 : Math.max(lo, Math.min(hi, n)); };

  /* ---------- Даты (по местному времени, а не UTC) ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return fmt(new Date()); }
  function addDays(s, n) { const p = s.split("-").map(Number); return fmt(new Date(p[0], p[1] - 1, p[2] + n)); }
  function parseDate(s) { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function shortDate(s) {
    const d = parseDate(s);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString("ru-RU", sameYear ? { day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" });
  }
  function plural(n, a, b, c) {
    const m = n % 100, k = n % 10;
    if (m > 10 && m < 20) return c;
    if (k === 1) return a;
    if (k >= 2 && k <= 4) return b;
    return c;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------- Данные ---------- */
  let state = load();
  let currentFilter = loadFilter();
  let lastToday = todayStr();
  const openDays = {}; // какие дни тренировок развёрнуты вручную

  function normRow(r) {
    if (!r || typeof r !== "object") return null;
    const sets = [];
    for (let i = 0; i < MAX_SETS; i++) sets.push(Array.isArray(r.sets) ? clampInt(r.sets[i], 0, 99) : 0);
    return { name: str(r.name).slice(0, 60), day: clampInt(r.day, 1, MAX_DAYS) || 1, sets: sets };
  }
  function normWTask(t) {
    if (!t || typeof t !== "object" || typeof t.key !== "string" || !DATE_RE.test(str(t.date))) return null;
    return {
      id: str(t.id) || uid(), key: t.key, text: str(t.text), exercise: str(t.exercise),
      day: clampInt(t.day, 1, MAX_DAYS) || 1, set: clampInt(t.set, 1, MAX_SETS) || 1,
      date: t.date, done: !!t.done
    };
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (data && Array.isArray(data.sections)) {
        data.sections.forEach(s => {
          s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
          s.tasks.forEach(t => {
            // Задачи из прошлых версий получают значения по умолчанию
            if (!PRIO_LABEL[t.priority]) t.priority = "medium";
            if (typeof t.deadline !== "string" || !DATE_RE.test(t.deadline)) t.deadline = "";
            if (typeof t.description !== "string") t.description = "";
            t.done = !!t.done;
          });
        });
        data.notes = (Array.isArray(data.notes) ? data.notes : []).filter(n => n && typeof n === "object").map(n => ({
          id: str(n.id) || uid(), title: str(n.title), text: str(n.text), pinned: !!n.pinned, updated: Number(n.updated) || Date.now()
        }));
        const w = data.workouts && typeof data.workouts === "object" ? data.workouts : {};
        data.workouts = {
          startDate: DATE_RE.test(str(w.startDate)) ? w.startDate : todayStr(),
          rows: (Array.isArray(w.rows) ? w.rows : []).map(normRow).filter(Boolean),
          tasks: (Array.isArray(w.tasks) ? w.tasks : []).map(normWTask).filter(Boolean)
        };
        return data;
      }
    } catch (e) {}
    return { sections: [], notes: [], workouts: { startDate: todayStr(), rows: [], tasks: [] } };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadFilter() {
    try {
      const f = localStorage.getItem(FILTER_KEY);
      if (FILTERS.some(x => x.id === f)) return f;
    } catch (e) {}
    return "all";
  }
  function storeFilter() {
    try { localStorage.setItem(FILTER_KEY, currentFilter); } catch (e) {}
  }
  function passesFilter(task) {
    if (currentFilter === "done") return task.done;
    if (currentFilter === "active") return !task.done;
    return true;
  }

  function commit() { save(); render(); }

  /* ---------- Помощники для DOM ---------- */
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    if (props) {
      const { attrs, ...rest } = props;
      Object.assign(node, rest);
      if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
    }
    children.forEach(c => { if (c != null) node.append(c); });
    return node;
  }

  function icon(name) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("class", "ico");
    s.setAttribute("aria-hidden", "true");
    s.innerHTML = ICONS[name]; // только собственные константы, не пользовательский ввод
    return s;
  }

  function iconButton(name, label, onClick, extraClass) {
    return el("button", {
      type: "button", className: "icon-btn " + (extraClass || ""), onclick: onClick,
      title: label, attrs: { "aria-label": label }
    }, icon(name));
  }

  function makeSelect(options, value) {
    const sel = el("select", { className: "field" },
      ...options.map(o => el("option", { value: o.id, textContent: o.label })));
    sel.value = value;
    return sel;
  }

  // Красная подсветка поля, когда выбран сегодняшний день
  function trackToday(input) {
    const upd = () => input.classList.toggle("is-today", input.value === todayStr());
    input.addEventListener("input", upd);
    input.addEventListener("change", upd);
    upd();
  }

  // Состояние срока: сегодня, просрочено, обычный; у выполненного тревожной подсветки нет
  function dueFor(dateStr, done) {
    const today = todayStr();
    let kind = "future", text = shortDate(dateStr);
    if (dateStr === today) { kind = "today"; text = "Сегодня"; }
    else if (dateStr < today) { kind = "overdue"; text = "Просрочено · " + text; }
    else if (dateStr === addDays(today, 1)) { text = "Завтра"; }
    if (done) kind = "done";
    return { kind: kind, text: text, title: "Дата: " + parseDate(dateStr).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }) };
  }
  function dueChip(dateStr, done) {
    const d = dueFor(dateStr, done);
    return el("span", { className: "due " + d.kind, title: d.title }, icon("cal"), d.text);
  }

  /* ---------- Диалог (карточки, подтверждения) ---------- */
  function openDialog(cfg) {
    return new Promise(resolve => {
      const dlg = $("dlg");
      const form = $("dlg-form");
      const inputs = {};
      let settled = false;
      const finish = v => { if (!settled) { settled = true; resolve(v); } };

      dlg.classList.toggle("wide", !!cfg.wide);
      form.replaceChildren();
      form.append(el("h3", { className: "dlg-title", textContent: cfg.title }));
      if (cfg.message) form.append(el("p", { className: "dlg-msg", textContent: cfg.message }));

      let grid = null;
      (cfg.fields || []).forEach(f => {
        let input, box;
        if (f.type === "select") {
          input = makeSelect(f.options, f.value);
        } else if (f.type === "textarea") {
          input = el("textarea", { className: "field", value: f.value || "", rows: f.rows || 4, maxLength: f.maxLength || 2000, placeholder: f.placeholder || "" });
        } else if (f.type === "checkbox") {
          input = el("input", { type: "checkbox", className: "check", checked: !!f.value });
        } else {
          input = el("input", { type: f.type || "text", className: "field", value: f.value || "", required: !!f.required, maxLength: f.maxLength || 200 });
        }
        input.id = "dlg-" + f.name;
        inputs[f.name] = input;

        if (f.type === "checkbox") {
          box = el("label", { className: "check-line", htmlFor: input.id }, input, f.label);
        } else {
          box = el("div", null, el("label", { className: "mini", htmlFor: input.id, textContent: f.label }));
          if (f.type === "date") {
            trackToday(input);
            const clear = el("button", { type: "button", className: "btn btn-ghost", textContent: "Без срока" });
            clear.onclick = () => { input.value = ""; input.dispatchEvent(new Event("input")); };
            box.append(el("div", { className: "date-row" }, input, clear));
          } else {
            box.append(input);
          }
        }

        if (f.half) {
          if (!grid) { grid = el("div", { className: "dlg-grid" }); form.append(grid); }
          grid.append(box);
        } else {
          grid = null;
          form.append(box);
        }
      });

      const actions = el("div", { className: "dlg-actions" });
      if (cfg.secondary) {
        const sec = el("button", { type: "button", className: "btn btn-danger-ghost", textContent: cfg.secondary.text });
        sec.onclick = () => { finish({ __action: cfg.secondary.action }); dlg.close(); };
        actions.append(sec);
      }
      const cancel = el("button", { type: "button", className: "btn btn-ghost", textContent: "Отмена" });
      cancel.onclick = () => dlg.close();
      const ok = el("button", { type: "submit", className: "btn " + (cfg.danger ? "btn-danger-solid" : "btn-brand"), textContent: cfg.submit || "Сохранить" });
      actions.append(cancel, ok);
      form.append(actions);

      form.onsubmit = e => {
        e.preventDefault();
        const values = {};
        for (const k in inputs) {
          const i = inputs[k];
          values[k] = i.type === "checkbox" ? i.checked : i.value.trim();
        }
        finish(values);
        dlg.close();
      };
      dlg.onclose = () => finish(null);
      dlg.showModal();
    });
  }

  // Закрытие по клику на затемнённый фон (только у обычных диалогов)
  $("dlg").addEventListener("click", e => {
    if (e.target === e.currentTarget) e.currentTarget.close();
  });

  /* ---------- Задачи ---------- */
  async function openTask(sec, task) {
    const v = await openDialog({
      title: "Карточка задачи",
      message: "Раздел: " + sec.title,
      wide: true,
      submit: "Сохранить",
      secondary: { text: "Удалить задачу", action: "delete" },
      fields: [
        { name: "text", label: "Название", value: task.text, required: true },
        { name: "done", label: "Выполнена", type: "checkbox", value: task.done },
        { name: "deadline", label: "Дедлайн", type: "date", value: task.deadline, half: true },
        { name: "priority", label: "Приоритет", type: "select", options: PRIORITIES, value: task.priority, half: true },
        { name: "description", label: "Описание", type: "textarea", rows: 5, value: task.description,
          placeholder: "Детали, ссылки, заметки…" }
      ]
    });
    if (!v) return;
    if (v.__action === "delete") {
      sec.tasks = sec.tasks.filter(t => t.id !== task.id);
      commit();
      return;
    }
    if (v.text) {
      task.text = v.text;
      task.done = v.done;
      task.deadline = v.deadline;
      task.priority = v.priority;
      task.description = v.description;
      commit();
    }
  }

  function renderSummary() {
    const box = $("summary");
    box.replaceChildren();
    const all = state.sections.flatMap(s => s.tasks);
    const done = all.filter(t => t.done).length;
    const today = todayStr();
    const dueToday = all.filter(t => !t.done && t.deadline === today).length;
    const overdue = all.filter(t => !t.done && t.deadline && t.deadline < today).length;
    box.append(el("span", { className: "sum-text", textContent: all.length ? "Задачи: выполнено " + done + " из " + all.length : "Пока нет задач" }));
    if (dueToday) box.append(el("span", { className: "due today", textContent: "Срок сегодня: " + dueToday }));
    if (overdue) box.append(el("span", { className: "due overdue", textContent: "Просрочено: " + overdue }));
    const wt = state.workouts.tasks.filter(t => t.date === today);
    if (wt.length) {
      const wd = wt.filter(t => t.done).length;
      box.append(el("span", { className: "sum-text", textContent: "Тренировка сегодня: " + wd + " из " + wt.length }));
    }
  }

  function renderFilter() {
    const box = $("filter");
    box.replaceChildren();
    if (!state.sections.length) return;
    const all = state.sections.flatMap(s => s.tasks);
    const counts = {
      all: all.length,
      active: all.filter(t => !t.done).length,
      done: all.filter(t => t.done).length
    };
    box.append(el("div", { className: "seg", attrs: { role: "group", "aria-label": "Фильтр задач" } },
      ...FILTERS.map(f => el("button", {
        type: "button",
        onclick: () => { currentFilter = f.id; storeFilter(); render(); },
        attrs: { "aria-pressed": String(currentFilter === f.id) }
      }, f.label, el("span", { className: "n", textContent: String(counts[f.id]) })))
    ));
  }

  function renderTask(sec, task) {
    const checkbox = el("input", { type: "checkbox", className: "check", checked: task.done,
      attrs: { "aria-label": "Выполнена: " + task.text } });
    checkbox.onchange = () => { task.done = checkbox.checked; commit(); };

    const main = el("div", { className: "task-main" },
      el("button", { type: "button", className: "task-title", textContent: task.text, title: "Открыть карточку",
        onclick: () => openTask(sec, task) })
    );
    if (task.description) {
      main.append(el("div", { className: "task-desc" }, icon("note"), el("span", { textContent: task.description })));
    }

    const row = el("li", { className: "task-row" + (task.done ? " done" : "") },
      checkbox,
      main,
      el("span", { className: "prio prio-" + task.priority, textContent: PRIO_LABEL[task.priority] })
    );

    if (task.deadline) row.append(dueChip(task.deadline, task.done));

    row.append(el("div", { className: "task-actions" },
      iconButton("edit", "Открыть карточку", () => openTask(sec, task)),
      iconButton("trash", "Удалить задачу", () => {
        sec.tasks = sec.tasks.filter(t => t.id !== task.id);
        commit();
      }, "danger")
    ));
    return row;
  }

  function renderAddForm(sec) {
    const text = el("input", { type: "text", className: "field", required: true, maxLength: 200, id: "nt-" + sec.id,
      placeholder: "Что нужно сделать?", attrs: { "aria-label": "Новая задача" } });
    const date = el("input", { type: "date", className: "field", id: "nd-" + sec.id });
    trackToday(date);
    const prio = makeSelect(PRIORITIES, "medium");
    prio.id = "np-" + sec.id;

    const form = el("form", { className: "add-form" },
      el("div", { className: "f-text" }, el("label", { className: "mini", htmlFor: text.id, textContent: "Новая задача" }), text),
      el("div", null, el("label", { className: "mini", htmlFor: date.id, textContent: "Дедлайн" }), date),
      el("div", null, el("label", { className: "mini", htmlFor: prio.id, textContent: "Приоритет" }), prio),
      el("button", { type: "submit", className: "btn btn-brand" }, icon("plus"), "Добавить")
    );
    form.onsubmit = e => {
      e.preventDefault();
      const value = text.value.trim();
      if (!value) return;
      sec.tasks.push({ id: uid(), text: value, done: false, deadline: date.value, priority: prio.value, description: "" });
      // Новая задача не выполнена: при фильтре «Выполненные» её бы не было видно
      if (currentFilter === "done") { currentFilter = "all"; storeFilter(); }
      commit();
    };
    return form;
  }

  function renderSection(sec) {
    const total = sec.tasks.length;
    const done = sec.tasks.filter(t => t.done).length;
    const visible = sec.tasks.filter(passesFilter);

    const head = el("div", { className: "sec-head" },
      el("h3", { className: "sec-title", textContent: sec.title }),
      el("span", { className: "sec-count", textContent: total ? done + " из " + total : "" }),
      iconButton("edit", "Переименовать раздел", async () => {
        const v = await openDialog({
          title: "Переименовать раздел",
          fields: [{ name: "title", label: "Название раздела", value: sec.title, required: true, maxLength: 80 }]
        });
        if (v && v.title) { sec.title = v.title; commit(); }
      }),
      iconButton("trash", "Удалить раздел", async () => {
        const v = await openDialog({
          title: "Удалить раздел?",
          message: total
            ? "Раздел «" + sec.title + "» и все его задачи (" + total + ") будут удалены без возможности восстановления."
            : "Раздел «" + sec.title + "» будет удалён.",
          submit: "Удалить", danger: true
        });
        if (v) { state.sections = state.sections.filter(s => s.id !== sec.id); commit(); }
      }, "danger")
    );

    const bar = el("div", { className: "bar", attrs: { "aria-hidden": "true" } },
      el("span", { style: "width:" + (total ? Math.round(done / total * 100) : 0) + "%" }));

    const list = visible.length
      ? el("ul", { className: "tasks" }, ...visible.map(t => renderTask(sec, t)))
      : el("p", { className: "no-tasks", textContent: total ? "Нет задач, подходящих под фильтр." : "В этом разделе пока нет задач." });

    return el("section", { className: "section-card" }, head, bar, list, renderAddForm(sec));
  }

  function renderTasksColumn() {
    renderFilter();
    const all = state.sections.flatMap(s => s.tasks);
    $("tasks-count").textContent = all.length ? all.filter(t => t.done).length + " из " + all.length : "";
    const root = $("sections");
    root.replaceChildren();
    if (!state.sections.length) {
      root.append(el("div", { className: "empty" },
        el("strong", { textContent: "Пока нет разделов" }),
        "Создайте первый раздел выше, например «Работа» или «Дом»."));
      return;
    }
    state.sections.forEach(sec => root.append(renderSection(sec)));
  }

  /* ---------- Тренировки ---------- */
  function cleanRows(rows) {
    return rows
      .filter(r => r.name.trim() && r.sets.some(s => s > 0))
      .map(r => ({ name: r.name.trim(), day: r.day, sets: r.sets.slice(0, MAX_SETS) }));
  }

  // Из таблицы получаем список подходов: каждый подход с повторами это одна задача
  function buildWorkoutTasks(rows, start) {
    const out = [];
    const seen = new Set();
    rows.map((r, i) => ({ r: r, i: i }))
      .filter(x => x.r.name.trim() && x.r.day >= 1)
      .sort((a, b) => a.r.day - b.r.day || a.i - b.i)
      .forEach(x => {
        const name = x.r.name.trim();
        x.r.sets.forEach((reps, si) => {
          if (!(reps > 0)) return;
          const key = name + "|" + x.r.day + "|" + (si + 1);
          if (seen.has(key)) return; // повтор той же строки игнорируем
          seen.add(key);
          out.push({
            key: key, exercise: name, day: x.r.day, set: si + 1, reps: reps,
            text: name + " — подход " + (si + 1) + ": " + reps + " " + plural(reps, "повтор", "повтора", "повторов"),
            date: addDays(start, x.r.day - 1)
          });
        });
      });
    return out;
  }

  // Пересобираем чеклисты по таблице, сохраняя отметки у подходов, которые остались в плане
  function syncWorkouts() {
    const w = state.workouts;
    const old = new Map(w.tasks.map(t => [t.key, t]));
    w.tasks = buildWorkoutTasks(w.rows, w.startDate).map(t => {
      const o = old.get(t.key);
      return { id: o ? o.id : uid(), key: t.key, text: t.text, exercise: t.exercise, day: t.day, set: t.set, date: t.date, done: o ? o.done : false };
    });
  }

  function dayGroups(tasks) {
    const groups = [];
    tasks.forEach(t => {
      let g = groups.find(x => x.day === t.day);
      if (!g) { g = { day: t.day, date: t.date, tasks: [] }; groups.push(g); }
      g.tasks.push(t);
    });
    return groups;
  }

  function defaultOpenDay(groups) {
    const today = todayStr();
    let g = groups.find(x => x.date === today);
    if (g) return g.day;
    g = groups.find(x => x.date > today);
    if (g) return g.day;
    g = groups.find(x => x.tasks.some(y => !y.done));
    return g ? g.day : null;
  }

  function renderWorkouts() {
    const box = $("workouts");
    box.replaceChildren();
    const w = state.workouts;
    const tasks = w.tasks;
    const done = tasks.filter(t => t.done).length;
    const days = new Set(tasks.map(t => t.day)).size;
    const exCount = new Set(tasks.map(t => t.exercise)).size;

    const plan = el("section", { className: "section-card" },
      el("div", { className: "sec-head" },
        el("h3", { className: "sec-title", textContent: "Мои тренировки" }),
        el("span", { className: "sec-count", textContent: tasks.length ? done + " из " + tasks.length : "" })));
    if (tasks.length) {
      plan.append(el("div", { className: "bar", attrs: { "aria-hidden": "true" } },
        el("span", { style: "width:" + Math.round(done / tasks.length * 100) + "%" })));
      plan.append(el("p", { className: "hint", textContent:
        exCount + " " + plural(exCount, "упражнение", "упражнения", "упражнений") + ", " +
        days + " " + plural(days, "день", "дня", "дней") + ", день 1 это " + shortDate(w.startDate) }));
    } else {
      plan.append(el("p", { className: "hint", textContent: "План пуст. Укажите упражнения, повторы по подходам и дни, и чеклисты появятся ниже." }));
    }
    plan.append(el("button", { type: "button", className: "btn btn-sm " + (tasks.length ? "btn-ghost" : "btn-brand"),
      style: "margin-top:14px", onclick: openWorkoutEditor }, icon("grid"), "Таблица тренировок"));
    box.append(plan);

    if (!tasks.length) return;

    const groups = dayGroups(tasks);
    const defOpen = defaultOpenDay(groups);
    const card = el("section", { className: "section-card" },
      el("div", { className: "sec-head" }, el("h3", { className: "sec-title", textContent: "Чеклисты" })));
    groups.forEach(g => {
      const gDone = g.tasks.filter(t => t.done).length;
      const allDone = gDone === g.tasks.length;
      const det = el("details", { className: "day" });
      det.open = (g.day in openDays) ? openDays[g.day] : g.day === defOpen;
      const sum = el("summary", null,
        el("span", { textContent: "День " + g.day }),
        dueChip(g.date, allDone),
        el("span", { className: "day-count", textContent: gDone + " из " + g.tasks.length }));
      sum.addEventListener("click", () => { openDays[g.day] = !det.open; });
      const ul = el("ul", { className: "tasks" });
      g.tasks.forEach(t => {
        const cb = el("input", { type: "checkbox", className: "check", checked: t.done, attrs: { "aria-label": "Выполнено: " + t.text } });
        cb.onchange = () => { t.done = cb.checked; commit(); };
        ul.append(el("li", { className: "task-row" + (t.done ? " done" : "") }, cb, el("div", { className: "task-main task-text", textContent: t.text })));
      });
      det.append(sum, ul);
      card.append(det);
    });
    box.append(card);
  }

  /* ---------- Редактор таблицы тренировок ---------- */
  function openWorkoutEditor() {
    const dlg = $("wdlg");
    const form = $("wdlg-form");
    const draft = {
      startDate: state.workouts.startDate,
      rows: state.workouts.rows.map(r => ({ name: r.name, day: r.day, sets: r.sets.slice() }))
    };
    if (!draft.rows.length) draft.rows.push({ name: "", day: 1, sets: [0, 0, 0, 0] });
    let mode = "A";
    let selEx = "";
    let extra = [];

    const tblArea = el("div");
    const info = el("p", { className: "wd-info", attrs: { role: "status" } });
    const warn = el("p", { className: "wd-warn" });

    function updateInfo() {
      const tasks = buildWorkoutTasks(cleanRows(draft.rows), draft.startDate);
      const days = new Set(tasks.map(t => t.day)).size;
      const keys = new Set(tasks.map(t => t.key));
      const lost = state.workouts.tasks.filter(t => t.done && !keys.has(t.key)).length;
      info.textContent = tasks.length
        ? "Будет " + tasks.length + " " + plural(tasks.length, "задача", "задачи", "задач") + " на " + days + " " + plural(days, "день", "дня", "дней") + ". Уже отмеченные подходы останутся отмеченными."
        : "Добавьте упражнение и повторы хотя бы в одном подходе.";
      warn.textContent = lost ? "Будет удалено отмеченных подходов: " + lost + "." : "";
    }

    /* Вид A: список строк */
    function renderA() {
      tblArea.replaceChildren();
      const tbody = el("tbody");
      draft.rows.forEach((r, i) => {
        const name = el("input", { type: "text", className: "field", value: r.name, placeholder: "Упражнение", maxLength: 60, attrs: { "aria-label": "Упражнение" } });
        name.oninput = () => { r.name = name.value; updateInfo(); };
        const day = el("input", { type: "number", className: "field", value: r.day || "", min: 1, max: MAX_DAYS, attrs: { "aria-label": "День" } });
        day.oninput = () => { const v = clampInt(day.value, 1, MAX_DAYS); if (v) { r.day = v; updateInfo(); } };
        day.onchange = () => { r.day = clampInt(day.value, 1, MAX_DAYS) || 1; day.value = r.day; updateInfo(); };
        const tr = el("tr", null, el("td", null, name), el("td", { style: "width:78px" }, day));
        for (let s = 0; s < MAX_SETS; s++) {
          const inp = el("input", { type: "number", className: "field", value: r.sets[s] || "", min: 1, max: 99, attrs: { "aria-label": "Повторы, подход " + (s + 1) } });
          inp.oninput = () => { r.sets[s] = clampInt(inp.value, 1, 99); updateInfo(); };
          inp.onchange = () => { inp.value = r.sets[s] || ""; };
          tr.append(el("td", { style: "width:74px" }, inp));
        }
        tr.append(el("td", { style: "width:40px" },
          iconButton("trash", "Удалить строку", () => { draft.rows.splice(i, 1); if (!draft.rows.length) draft.rows.push({ name: "", day: 1, sets: [0, 0, 0, 0] }); renderTable(); }, "danger")));
        tbody.append(tr);
      });
      const head = el("thead", null, el("tr", null,
        el("th", { textContent: "Упражнение", style: "padding-left:12px" }), el("th", { textContent: "День" }),
        el("th", { textContent: "Подход 1" }), el("th", { textContent: "Подход 2" }), el("th", { textContent: "Подход 3" }), el("th", { textContent: "Подход 4" }), el("th")));
      tblArea.append(el("div", { className: "tbl-wrap" }, el("div", { className: "tbl-scroll" }, el("table", { className: "plan" }, head, tbody))));
      tblArea.append(el("button", { type: "button", className: "btn btn-ghost btn-sm", style: "margin-top:12px",
        onclick: () => { draft.rows.push({ name: "", day: 1, sets: [0, 0, 0, 0] }); renderTable(); } }, icon("plus"), "Добавить строку"));
    }

    /* Вид B: сетка 30 дней × 4 подхода по одному упражнению */
    function exNames() {
      const names = [];
      draft.rows.forEach(r => { const n = r.name.trim(); if (n && !names.includes(n)) names.push(n); });
      extra.forEach(n => { if (!names.includes(n)) names.push(n); });
      return names;
    }
    const findRow = (name, day) => draft.rows.find(r => r.name.trim() === name && r.day === day);

    function renderB() {
      tblArea.replaceChildren();
      const names = exNames();
      if (!names.includes(selEx)) selEx = names[0] || "";
      const bar = el("div", { className: "ex-bar" });
      if (names.length) {
        bar.append(el("div", { className: "seg", attrs: { role: "group", "aria-label": "Упражнение" } },
          ...names.map(n => el("button", { type: "button", textContent: n, onclick: () => { selEx = n; renderB(); }, attrs: { "aria-pressed": String(n === selEx) } }))));
      }
      const newName = el("input", { type: "text", className: "field", placeholder: "Новое упражнение", maxLength: 60, attrs: { "aria-label": "Название нового упражнения" } });
      const addNew = () => {
        const n = newName.value.trim();
        if (!n) return;
        if (!extra.includes(n)) extra.push(n);
        selEx = n;
        renderB();
      };
      newName.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNew(); } };
      bar.append(el("div", { className: "ex-add" }, newName, el("button", { type: "button", className: "btn btn-ghost btn-sm", onclick: addNew }, icon("plus"), "Добавить")));
      tblArea.append(bar);
      if (!selEx) { tblArea.append(el("p", { className: "hint", textContent: "Добавьте первое упражнение." })); updateInfo(); return; }

      const tbody = el("tbody");
      for (let d = 1; d <= MAX_DAYS; d++) {
        const r = findRow(selEx, d);
        const tr = el("tr", null, el("td", { className: "day-cell", textContent: "День " + d }));
        for (let s = 0; s < MAX_SETS; s++) {
          const inp = el("input", { type: "number", className: "field", value: r && r.sets[s] ? r.sets[s] : "", min: 1, max: 99, attrs: { "aria-label": "День " + d + ", подход " + (s + 1) } });
          inp.oninput = () => {
            let row = findRow(selEx, d);
            if (!row) { row = { name: selEx, day: d, sets: [0, 0, 0, 0] }; draft.rows.push(row); }
            row.sets[s] = clampInt(inp.value, 1, 99);
            if (row.sets.every(x => !x)) draft.rows.splice(draft.rows.indexOf(row), 1);
            updateInfo();
          };
          inp.onchange = () => { const rr = findRow(selEx, d); inp.value = rr && rr.sets[s] ? rr.sets[s] : ""; };
          tr.append(el("td", null, inp));
        }
        tbody.append(tr);
      }
      const head = el("thead", null, el("tr", null, el("th", { textContent: selEx, style: "padding-left:12px" }),
        el("th", { textContent: "Подход 1" }), el("th", { textContent: "Подход 2" }), el("th", { textContent: "Подход 3" }), el("th", { textContent: "Подход 4" })));
      tblArea.append(el("div", { className: "tbl-wrap" }, el("div", { className: "tbl-scroll" }, el("table", { className: "plan" }, head, tbody))));
      tblArea.append(el("button", { type: "button", className: "btn btn-ghost btn-sm", style: "margin-top:12px",
        onclick: () => {
          const base = findRow(selEx, 1);
          if (!base) return;
          for (let d = 2; d <= MAX_DAYS; d++) {
            const ex = findRow(selEx, d);
            if (ex) ex.sets = base.sets.slice(); else draft.rows.push({ name: selEx, day: d, sets: base.sets.slice() });
          }
          renderB();
        } }, "Заполнить все 30 дней как день 1"));
    }

    function renderTable() {
      if (mode === "A") renderA(); else renderB();
      updateInfo();
    }

    const startInput = el("input", { type: "date", className: "field", id: "wd-start", value: draft.startDate });
    trackToday(startInput);
    startInput.addEventListener("change", () => { if (DATE_RE.test(startInput.value)) { draft.startDate = startInput.value; updateInfo(); } });
    startInput.addEventListener("input", () => { if (DATE_RE.test(startInput.value)) { draft.startDate = startInput.value; updateInfo(); } });

    const modeSeg = el("div", { className: "seg", style: "display:inline-flex;width:auto", attrs: { role: "group", "aria-label": "Вид таблицы" } });
    [["A", "Список"], ["B", "Сетка по дням"]].forEach(([id, label]) => {
      const b = el("button", { type: "button", textContent: label, style: "flex:none;padding:7px 14px", attrs: { "aria-pressed": String(mode === id) } });
      b.onclick = () => {
        mode = id;
        modeSeg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        renderTable();
      };
      modeSeg.append(b);
    });

    const clear = el("button", { type: "button", className: "btn btn-danger-ghost", textContent: "Очистить таблицу",
      onclick: () => { draft.rows = [{ name: "", day: 1, sets: [0, 0, 0, 0] }]; extra = []; selEx = ""; renderTable(); } });
    const cancel = el("button", { type: "button", className: "btn btn-ghost", textContent: "Отмена", onclick: () => dlg.close() });
    const ok = el("button", { type: "submit", className: "btn btn-brand", textContent: "Сохранить и обновить чеклисты" });

    form.replaceChildren(
      el("h3", { className: "dlg-title", textContent: "Таблица тренировок" }),
      el("p", { className: "dlg-msg", textContent: "Не больше 4 подходов в упражнении и 30 дней в плане. Пустая ячейка значит, что подхода нет." }),
      el("div", { className: "wd-top" },
        el("div", { className: "f" }, el("label", { className: "mini", htmlFor: "wd-start", textContent: "День 1 это" }), startInput),
        modeSeg),
      tblArea, info, warn,
      el("div", { className: "dlg-actions" }, clear, cancel, ok)
    );

    form.onsubmit = e => {
      e.preventDefault();
      state.workouts.rows = cleanRows(draft.rows);
      state.workouts.startDate = draft.startDate;
      syncWorkouts();
      commit();
      dlg.close();
    };
    renderTable();
    dlg.showModal();
  }

  /* ---------- Заметки ---------- */
  async function openNote(note) {
    const isNew = !note;
    const v = await openDialog({
      title: isNew ? "Новая заметка" : "Заметка",
      wide: true,
      submit: "Сохранить",
      secondary: isNew ? null : { text: "Удалить", action: "delete" },
      fields: [
        { name: "title", label: "Заголовок", value: isNew ? "" : note.title, maxLength: 120 },
        { name: "text", label: "Текст", type: "textarea", rows: 9, maxLength: 5000, value: isNew ? "" : note.text, placeholder: "Мысли, списки, ссылки…" },
        { name: "pinned", label: "Закрепить вверху", type: "checkbox", value: isNew ? false : note.pinned }
      ]
    });
    if (!v) return;
    if (v.__action === "delete") {
      state.notes = state.notes.filter(n => n.id !== note.id);
      commit();
      return;
    }
    if (!v.title && !v.text) return; // пустую заметку не создаём
    if (isNew) {
      state.notes.push({ id: uid(), title: v.title, text: v.text, pinned: v.pinned, updated: Date.now() });
    } else {
      note.title = v.title; note.text = v.text; note.pinned = v.pinned; note.updated = Date.now();
    }
    commit();
  }

  function renderNotes() {
    const box = $("notes");
    box.replaceChildren();
    const q = $("note-search").value.trim().toLowerCase();
    const list = state.notes
      .filter(n => !q || (n.title + " " + n.text).toLowerCase().includes(q))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updated - a.updated));
    if (!list.length) {
      box.append(el("div", { className: "empty", style: "margin-top:0" },
        el("strong", { textContent: state.notes.length ? "Ничего не найдено" : "Пока нет заметок" }),
        state.notes.length ? "Попробуйте другой запрос." : "Нажмите «Новая», чтобы записать мысль или список."));
      return;
    }
    list.forEach(n => {
      const card = el("article", { className: "note", tabIndex: 0, attrs: { role: "button" } },
        el("h3", null, el("span", { textContent: n.title || "Без названия" }), n.pinned ? el("span", { className: "pin", textContent: "закреплена" }) : null),
        n.text ? el("p", { textContent: n.text }) : null,
        el("div", { className: "meta", textContent: new Date(n.updated).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) }));
      card.onclick = () => openNote(n);
      card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openNote(n); } };
      box.append(card);
    });
  }

  /* ---------- Общая отрисовка и запуск ---------- */
  function render() {
    lastToday = todayStr();
    renderSummary();
    renderTasksColumn();
    renderWorkouts();
    renderNotes();
  }

  $("section-submit").append(icon("plus"), "Раздел");
  $("section-submit").setAttribute("aria-label", "Добавить раздел");
  $("note-new").append(icon("plus"), "Новая");
  $("note-new").onclick = () => openNote(null);
  $("note-search").addEventListener("input", renderNotes);

  $("section-form").onsubmit = e => {
    e.preventDefault();
    const input = $("section-input");
    const title = input.value.trim();
    if (!title) return;
    state.sections.push({ id: uid(), title: title, tasks: [] });
    input.value = "";
    commit();
  };

  // Если вкладка осталась открытой за полночь, обновляем подсветку «сегодня»
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && todayStr() !== lastToday) render();
  });

  render();
</script>
</body>
</html>
